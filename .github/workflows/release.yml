name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm exec install-electron

      - name: Verify tag version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Git tag $tagVersion does not match package.json version $packageVersion"
          }

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release

      - name: Verify latest release pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $expected = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"

          # 发布是异步的：electron-builder 上传资产后才发布 Release，本步骤常先于它结束。
          # 因此先等 Release 出现，再判断指针；查询失败不再吞成空串（空串会同时绕过
          # 草稿检测和标签比对，把"还没发布完"误报成"指针没迁移"）。
          # build.releaseType=release（package.json）后 electron-builder 直接发布非草稿，
          # 草稿分支仅作兜底：若将来配置回退到默认 draft，此步骤仍能给出正确指引。
          # 已知历史坑：electron-builder 上传大资产时可能并发创建两个草稿（exe+latest.yml
          # 一个、blockmap 一个），此时按 warning 指引人工合并草稿后发布。
          $retries = 12
          for ($i = 1; $i -le $retries; $i++) {
            $info = gh api "repos/$repo/releases/tags/$expected" 2>&1
            if ($LASTEXITCODE -eq 0) {
              $draft = ($info | ConvertFrom-Json).draft
              if ($draft -eq $true) {
                Write-Output "::warning::electron-builder left release $expected as a DRAFT. Publish it manually with release notes and -F make_latest=true; electron-updater clients cannot see drafts."
                exit 0
              }
              break
            }
            if ($i -eq $retries) {
              throw "Release $expected never appeared within $($retries * 5)s: $info"
            }
            Write-Output "Attempt ${i}: release $expected not published yet, waiting..."
            Start-Sleep -Seconds 5
          }

          for ($i = 1; $i -le $retries; $i++) {
            $latest = gh api "repos/$repo/releases/latest" --jq .tag_name 2>&1
            if ($LASTEXITCODE -eq 0 -and $latest -eq $expected) {
              Write-Output "Latest release points to $latest"
              exit 0
            }
            Write-Output "Attempt ${i}: latest is '$latest', expected '$expected'"
            Start-Sleep -Seconds 5
          }
          throw "releases/latest points to '$latest' instead of '$expected'. electron-updater clients will not see the new version. Fix with: gh api -X PATCH repos/$repo/releases/<release-id> -F make_latest=true"
